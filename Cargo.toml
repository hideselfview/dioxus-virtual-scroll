[package]
name = "dioxus-virtual-scroll"
version = "0.1.0"
edition = "2021"
description = "Virtual scrolling grid component for Dioxus"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/dioxus-virtual-scroll"

[dependencies]
dioxus = { git = "https://github.com/ealmloff/dioxus", branch = "wasm-bindgen", default-features = false, features = ["signals", "html", "macro", "hooks"] }
web-sys-x = { version = "0.3.83-alpha.1", features = ["Element", "HtmlElement", "DomRect", "Window", "Document", "ScrollToOptions", "ScrollBehavior", "AddEventListenerOptions", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "EventTarget", "CssStyleDeclaration"] }
wasm-bindgen-x = "0.2.106-alpha.1"
js-sys-x = "0.3.83-alpha.1"
wasm-bindgen-futures-x = "0.4.56-alpha.1"
tracing = "0.1"

[dev-dependencies]
dioxus = { git = "https://github.com/ealmloff/dioxus", branch = "wasm-bindgen", features = ["web"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dioxus = { git = "https://github.com/ealmloff/dioxus", branch = "wasm-bindgen", features = ["desktop"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = ["js"] }

[[example]]
name = "stress_test"

[[example]]
name = "web_demo"
